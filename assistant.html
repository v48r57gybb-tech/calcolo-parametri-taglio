<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente rapido CNC</title><style>body{margin:0;font:17px system-ui;background:#eef4fa}header{padding:16px;background:#123f76;color:white}iframe{width:100%;height:85vh;border:0}p{line-height:1.5}</style><header>ASSISTENTE RAPIDO CNC · Classica<p>Guida di compilazione e schede locali. Nessun database produttori precaricato; nessuna intelligenza artificiale o selezione autonoma dei dati di taglio.</p></header><iframe id="app" src="./index.html?layout=classica-c158a5d" title="Calcolatrice CNC Classica"></iframe><p id="status" role="status">Caricamento della calcolatrice…</p><script>'use strict';const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);if(!$('calculate')||!$('grade'))throw Error('Versione Classica non ancora disponibile: ricarica dopo la pubblicazione.');document.getElementById('status').textContent='Assistente caricato.';const box=d.createElement('section');box.style.cssText='background:#e9f5ff;border-top-color:#2464bb';box.innerHTML='<h2>Assistente · lavoro veloce</h2><p id="guide" role="status"></p><button id="next">VAI AL PROSSIMO DATO</button><button id="suggest">CARICA PARAMETRI CONSIGLIATI / SALVATI</button><small>Richiamo di schede inserite da te, non raccomandazioni generate. Confronto esatto dei campi tecnici; verifica sempre validità della fonte e condizioni reali. Nessuna scheda precaricata.</small><label>Schede compatibili<select id="matches"></select></label><pre id="profileInfo"></pre><button id="apply">APPLICA LA SCHEDA SELEZIONATA E CALCOLA</button><details><summary>Salva una scheda documentata per riutilizzarla</summary><label>Nome scheda<input id="profileName"></label><label>Tipo fonte<select id="profileKind"><option>Dati produttore trascritti dall’utente</option><option>Prova personale, non raccomandazione produttore</option></select></label><label>Condizioni / limiti di applicazione<textarea id="profileConditions"></textarea></label><button id="storeProfile">SALVA SCHEDA CON I DATI ATTUALI</button><small>Prima compila materiale specifico e stato, codice utensile/rivestimento, fonte, geometria di impegno e limiti macchina. Il salvataggio non verifica la correttezza dei dati del catalogo.</small></details><button id="exportProfiles">ESPORTA SCHEDE JSON</button><p id="assistantError" role="alert"></p>';d.querySelector('main').insertBefore(box,$('form'));const KEY='cnc_assistant_profiles_v1',context=['operation','strategy','material','grade','tool','coating','d','z','stick','shank','ap','ae','coolant','smax','fmax'],all=[...context,'source','vc','load'],labels={vc:'Vc (velocità di taglio)',load:'fz / fn (avanzamento)',d:'D (diametro)',z:'z (taglienti)' };let candidates=[];const norm=x=>String(x??'').trim().toLowerCase().replace(',','.');function contextIds(){return context.filter(id=>!($('operation').value==='drilling'&&['strategy','z','ap','ae'].includes(id)))}function read(){const a=JSON.parse(w.localStorage.getItem(KEY)||'[]');if(!Array.isArray(a))throw Error('Archivio schede non valido; non sovrascritto.');return a}function next(){return ['d','vc',...($('operation').value==='milling'?['z']:[]),'load'].find(id=>!$(id).value.trim())}function guide(){const id=next();$('guide').textContent=id?'Prossimo dato indispensabile: '+labels[id]+'. Oppure compila il contesto per cercare una scheda.':'Dati principali presenti: puoi calcolare. Non è una verifica di idoneità della lavorazione.'}function resetMatches(){candidates=[];$('matches').replaceChildren();$('profileInfo').textContent='';$('apply').disabled=true}function info(){const r=candidates[Number($('matches').value)];$('profileInfo').textContent=r?r.name+'\n'+r.kind+'\nFonte: '+r.values.source+'\nCondizioni: '+r.conditions+'\nVc: '+r.values.vc+' m/min\n'+(r.values.operation==='milling'?'fz: ':'fn: ')+r.values.load+'\nSalvata: '+r.date:''}function download(text,name){const u=w.URL.createObjectURL(new w.Blob([text],{type:'application/json'})),a=d.createElement('a');a.href=u;a.download=name;d.body.append(a);a.click();a.remove();w.setTimeout(()=>w.URL.revokeObjectURL(u),30000)}$('next').onclick=()=>{const id=next();(id?$(id):$('calculate')).focus();(id?$(id):$('calculate')).scrollIntoView({behavior:'smooth',block:'center'})};$('suggest').onclick=()=>{try{resetMatches();const profiles=read();candidates=profiles.filter(r=>contextIds().every(id=>norm(r.values[id])===norm($(id).value)));if(!candidates.length){$('assistantError').textContent=profiles.length?'Nessuna scheda corrisponde esattamente al contesto. Completa materiale specifico, codice utensile, diametro, impegno e condizioni; non vengono usati valori di combinazioni diverse.':'Nessuna scheda disponibile. Inserisci una volta i dati verificati del produttore o una tua prova: potrai richiamarli nei lavori successivi.';return}candidates.forEach((r,i)=>{const o=d.createElement('option');o.value=i;o.textContent=r.name+' · '+r.kind;$('matches').append(o)});$('apply').disabled=false;$('assistantError').textContent='Leggi fonte e condizioni prima di applicare.';info()}catch(e){$('assistantError').textContent=e.message}};$('matches').onchange=info;$('apply').onclick=()=>{const r=candidates[Number($('matches').value)];if(!r)return;if(!contextIds().every(id=>norm(r.values[id])===norm($(id).value))){resetMatches();return}if(!w.confirm('Hai verificato fonte, condizioni e compatibilità della scheda '+r.name+'? Sostituire Vc e avanzamento attuali e calcolare?'))return;['vc','load','source'].forEach(id=>{$(id).value=r.values[id];$(id).dispatchEvent(new w.Event('input',{bubbles:true}))});$('calculate').click();guide()};$('storeProfile').onclick=()=>{try{if(!next())$('calculate').click();if($('result').hidden)throw Error('Completa i dati e genera un risultato numericamente valido prima di salvare.');for(const id of ['grade','coating','source'])if(!$(id).value.trim())throw Error('Compila '+id+' per documentare la scheda.');if(!$('profileName').value.trim()||!$('profileConditions').value.trim())throw Error('Inserisci nome e condizioni della scheda.');const values=Object.fromEntries(all.map(id=>[id,$(id).value])),a=read();a.unshift({name:$('profileName').value.trim(),kind:$('profileKind').value,conditions:$('profileConditions').value.trim(),date:new Date().toISOString(),values});w.localStorage.setItem(KEY,JSON.stringify(a));$('assistantError').textContent='Scheda salvata nel browser. Non è una validazione tecnica.'}catch(e){$('assistantError').textContent=e.message}};$('exportProfiles').onclick=()=>{try{download(JSON.stringify(read(),null,2),'schede-assistente-cnc.json')}catch(e){$('assistantError').textContent=e.message}};d.getElementById('form').addEventListener('input',()=>{guide();resetMatches()});d.getElementById('form').addEventListener('change',()=>{guide();resetMatches()});resetMatches();guide()}catch(e){document.getElementById('status').textContent=e.message}});</script></html>
